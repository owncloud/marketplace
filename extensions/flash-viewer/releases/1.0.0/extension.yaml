name: Flash Viewer
subtitle: Flash (SWF) viewer for ownCloud
description: ownCloud oCIS web extension for viewing Adobe Flash (.swf) files, powered by Ruffle. Note that you need `wasm-unsafe-eval` in the `script-src` CSP directive to use Ruffle in oCIS.
